name: GitHub Release Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Calculate next version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            VERSION_NAME="1.0.1"
            VERSION_CODE=1
          else
            LAST_VERSION="${LAST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"

            PATCH=$((PATCH + 1))

            VERSION_NAME="$MAJOR.$MINOR.$PATCH"

            VERSION_CODE=$(git tag --list 'v*' | wc -l)
            VERSION_CODE=$((VERSION_CODE + 1))
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "Building version: $VERSION_NAME (code $VERSION_CODE)"

      - name: Set version for this build
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts

      - name: Restore Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: EboneFieldManager-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Version ${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
